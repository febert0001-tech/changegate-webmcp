name: Merchant staging container

on:
  pull_request:
    branches: [main, feat/private-merchant-staging]
    paths:
      - '.github/workflows/staging-container.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'next.config.ts'
      - 'scripts/**'
      - 'src/merchant-team/**'
      - 'src/app/merchant/**'
      - 'src/app/api/merchant/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: docker build --tag changegate-staging:test .
      - run: node scripts/check-merchant-staging.mjs changegate-staging:test
