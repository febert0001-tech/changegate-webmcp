name: ChangeGate checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify offline case handoff in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/changegate-browser" --no-save --ignore-scripts playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/changegate-browser/node_modules" CHROME_BIN="$(command -v google-chrome)" node scripts/verify-refund-desk.mjs
